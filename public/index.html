<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d19"><title>لعبة العائلة — V6</title><script src="/socket.io/socket.io.js"></script><style>
:root{--bg:#070a12;--panel:#101728;--panel2:#151e32;--line:#2a3652;--text:#f8fafc;--muted:#9ca9bf;--gold:#ffd166;--red:#ef4052;--red2:#a91f32;--blue:#3287ff;--blue2:#124d9c;--violet:#755cff;--green:#36d399}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#060810;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}body{overflow-x:hidden}.app{min-height:100vh}.shell{max-width:1240px;margin:auto;padding:22px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:1000}.mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),var(--violet),var(--blue));box-shadow:0 10px 35px #0008;font-size:25px}.card{background:linear-gradient(180deg,#11192add,#0c1220f5);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 22px 70px #0008;backdrop-filter:blur(14px)}.hero{padding:54px 28px;text-align:center}.hero h1{font-size:clamp(38px,7vw,78px);line-height:1;margin:12px 0}.sub{color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.btn{border:0;border-radius:15px;padding:13px 17px;font-weight:900;cursor:pointer;background:#e8edf7;color:#10131b;transition:.18s transform,.18s filter}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary{background:linear-gradient(135deg,#765cff,#5745e9);color:#fff}.red{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}.blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}.dark{background:#1a2337;color:#fff}.gold{background:linear-gradient(135deg,#ffe38a,#dcae38);color:#241b06}.danger{background:#7e2330;color:#fff}.input,select{width:100%;background:#080e1a;color:#fff;border:1px solid #34415f;border-radius:14px;padding:13px;margin:6px 0 12px;font:inherit}.label{font-size:13px;color:#b7c2d6}.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #33405d;background:#19233a;border-radius:999px;color:#dce5f4}.teams{display:grid;grid-template-columns:1fr 1fr;gap:16px}.team{border-radius:23px;padding:20px;border:1px solid #33415f;background:#111a2c;position:relative;overflow:hidden}.team:before{content:"";position:absolute;inset:0;opacity:.12;pointer-events:none}.team.a:before{background:radial-gradient(circle at 20% 20%,var(--red),transparent 55%)}.team.b:before{background:radial-gradient(circle at 80% 20%,var(--blue),transparent 55%)}.team.a{border-color:#7f2d3b}.team.b{border-color:#285c9f}.teamName{font-size:21px;font-weight:1000}.score{font-size:66px;font-weight:1000;line-height:1;margin:10px 0}.strikes{font-size:25px;letter-spacing:4px}.players{color:#b9c5d9;min-height:26px;margin:7px 0}.question{font-size:clamp(28px,4vw,52px);font-weight:1000;text-align:center;line-height:1.15;margin:24px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{min-height:90px;border-radius:18px;border:1px solid #36445f;background:linear-gradient(180deg,#202c45,#151e31);display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900;padding:15px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}.answer:hover{transform:translateY(-2px)}.answer .pts{display:block;color:var(--gold);font-size:18px;margin-top:4px}.answer.revealed{animation:reveal .55s cubic-bezier(.2,.9,.2,1);border-color:#b8c8ef;box-shadow:0 0 35px #6d5dfc35}.answer.hiddenAns{color:#fff;background:radial-gradient(circle,#263756,#141d2f)}.timer{font-size:52px;font-weight:1000;text-align:center;margin:16px}.timer.hot{color:#ff5b68;animation:pulse .6s infinite alternate}.buzzer{width:100%;height:240px;border:0;border-radius:38px;background:radial-gradient(circle at 50% 35%,#ff6b79,var(--red) 45%,#a71f31);color:#fff;font-size:52px;font-weight:1000;box-shadow:0 15px 0 #791827,0 30px 60px #0009;cursor:pointer;transition:.15s}.buzzer:active{transform:translateY(10px);box-shadow:0 5px 0 #791827}.buzzer:disabled{background:#3a4251;box-shadow:none;cursor:not-allowed}.buzz{padding:18px;text-align:center;border:1px solid #556582;background:#19233a;border-radius:18px;font-size:25px;font-weight:1000;animation:buzz .4s 2}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#1a2340 0,#090d18 48%,#05070d 100%)}.tv{width:min(1500px,96vw);padding:28px}.tv .card{border-radius:34px;background:linear-gradient(180deg,#0e1628ee,#080d18fa);border-color:#3b4865;box-shadow:0 0 80px #000b}.tv .answers .answer{min-height:110px;font-size:26px}.tv .question{margin:30px 0 22px}.tv .score{font-size:74px}.winner{font-size:clamp(44px,7vw,94px);font-weight:1000;text-align:center;margin:25px 0;animation:winner 1s both}.confetti{font-size:38px;text-align:center;letter-spacing:14px;animation:float 1.5s infinite alternate}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.bankRow{padding:17px;border:1px solid #2d3a56;border-radius:18px;background:#121b2d;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.qr{width:180px;height:180px;background:#fff;padding:10px;border-radius:18px}.muted{color:var(--muted)}.sound{position:fixed;left:18px;bottom:18px;z-index:50;border-radius:999px}.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-130%);background:#111b2e;border:1px solid #3a4967;border-radius:999px;padding:12px 18px;z-index:100;font-weight:800;transition:.3s}.toast.show{transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:80;padding:20px}.modalBox{max-width:650px;width:100%;background:#10182a;border:1px solid #394865;border-radius:25px;padding:25px;box-shadow:0 30px 90px #000}.hidden{display:none!important}@keyframes reveal{0%{transform:rotateX(90deg) scale(.8);opacity:0}100%{transform:rotateX(0) scale(1);opacity:1}}@keyframes pulse{to{transform:scale(1.06)}}@keyframes buzz{50%{transform:scale(1.02);filter:brightness(1.5)}}@keyframes winner{0%{transform:scale(.55);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@keyframes float{to{transform:translateY(-8px)}}@media(max-width:760px){.grid,.grid3,.teams,.answers{grid-template-columns:1fr}.shell{padding:12px}.hero{padding:36px 18px}.buzzer{height:200px;font-size:42px}.tv{padding:8px}.tv .answers .answer{min-height:86px;font-size:20px}.qr{width:145px;height:145px}}
</style></head><body><div id="toast" class="toast"></div><main id="app" class="app"></main><script>
const socket=io();let role='',code='',playerTeam='',lastState=null,soundOn=true,audioCtx=null,roundIntro=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tone(freq=440,d=.16,type='sine',gain=.14){if(!soundOn)return;audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.02)}
function fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.24,'triangle',.12),i*110))}function clickSound(){tone(330,.07,'square',.06)}function toggleSound(){soundOn=!soundOn;toast(soundOn?'🔊 المؤثرات مفعلة':'🔇 المؤثرات مكتومة');if(soundOn)tone(660,.12,'triangle')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2400)}
function logo(){return `<div class="brand"><div class="mark">🏆</div><div><div>لعبة العائلة</div><div class="muted" style="font-size:11px">FAMILY FEUD • V6</div></div></div>`}
function home(){role='';app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="toggleSound()">🔊 الصوت</button></div><section class="card hero"><div class="pill">🎬 الإصدار التلفزيوني V6</div><h1>لعبة العائلة</h1><p class="sub">مسابقة مباشرة • مقدم • شاشة عرض • متسابقون من الجوال</p><div class="grid" style="margin-top:28px"><button class="btn primary" onclick="host()">🎤 لوحة المقدم</button><button class="btn gold" onclick="display()">📺 شاشة العرض</button><button class="btn red" onclick="player()">📱 دخول المتسابق</button><button class="btn dark" onclick="showHow()">❓ طريقة اللعب</button></div></section></div>`}
function showHow(){modal(`<h2>🎬 كيف تلعب؟</h2><p class="muted">1. المقدم ينشئ غرفة.<br>2. يظهر رمز الغرفة وQR للمتسابقين.<br>3. المتسابقون يدخلون من الجوال ويختارون الفريق.<br>4. عند بدء السؤال، أول ضغط على الزر يُحتسب.<br>5. اكشف الإجابات، أضف النقاط، وسجل الـStrikes.</p><button class="btn primary" onclick="closeModal()">فهمت</button>`)}
function modal(html){let m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML=`<div class="modalBox">${html}</div>`;document.body.appendChild(m)}function closeModal(){$('modal')?.remove()}
function host(){role='host';app.innerHTML=`<div class="shell">${logo()}<section class="card" style="margin-top:16px"><h1>🎤 إعداد اللعبة</h1><p class="muted">🔐 لوحة المقدم محمية بـ PIN خاص. رمز الغرفة وحده لا يسمح بدخول المقدم.</p><div class="grid"><div><label class="label">عدد الجولات</label><input class="input" id="rounds" type="number" min="1" max="50" value="5"></div><div><label class="label">وقت الجولة</label><input class="input" id="time" type="number" min="5" max="600" value="30"></div><div><label class="label">اسم الفريق الأحمر</label><input class="input" id="ta" value="الفريق الأحمر"></div><div><label class="label">اسم الفريق الأزرق</label><input class="input" id="tb" value="الفريق الأزرق"></div></div><div class="toolbar"><button class="btn primary" onclick="createGame()">✨ إنشاء غرفة</button><button class="btn dark" onclick="rejoinHost()">🔐 دخول غرفة موجودة</button><button class="btn dark" onclick="home()">رجوع</button></div></section></div>`}
function createGame(){clickSound();socket.emit('host:create',{rounds:+$('rounds').value,time:+$('time').value,teamA:$('ta').value,teamB:$('tb').value})}function rejoinHost(){const c=prompt('رمز الغرفة');const p=prompt('PIN المقدم (6 أرقام)');if(c&&p){code=c.toUpperCase();socket.emit('host:rejoin',{code,pin:p})}}
socket.on('game:created',x=>{code=x.code;localStorage.setItem('ff_host_code',x.code);localStorage.setItem('ff_host_pin',x.pin);toast('تم إنشاء الغرفة '+x.code);renderHost(lastState||{});modal(`<h2>🎉 الغرفة جاهزة</h2><div class="row"><div><div class="code" style="font-size:44px;font-weight:1000;letter-spacing:7px">${esc(x.code)}</div><p>PIN المقدم: <b>${esc(x.pin)}</b></p><p class="muted">امسح QR أو أرسل رمز الغرفة للمتسابقين.</p></div><img class="qr" src="/qr/${encodeURIComponent(x.code)}" alt="QR"></div><button class="btn primary" onclick="closeModal()">ابدأ</button>`)});
socket.on('host:rejoined',()=>{code=localStorage.getItem('ff_host_code')||code;toast('تم الدخول للغرفة')});
function renderHost(s){lastState=s;if(!s?.code){app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="home()">الرئيسية</button></div><section class="card hero"><h1>الغرفة جاهزة</h1><p class="muted">أنشئ غرفة أو ادخل غرفة موجودة.</p></section></div>`;return}const bank=s.questionBank||[];app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<div class="toolbar"><span class="pill">🏠 ${esc(s.code)}</span><button class="btn dark" onclick="openShare()">📤 مشاركة</button><button class="btn dark" onclick="toggleSound()">🔊</button></div></div><section class="card"><div class="teams">${s.teams.map(t=>teamCard(t)).join('')}</div></section><section class="card"><div class="row"><div><span class="pill">الجولة ${s.currentRound} / ${s.rounds}</span><h2>${esc(s.question||'اختر سؤالًا من بنك الأسئلة')}</h2></div><div class="timer ${s.timer<=5?'hot':''}">⏱️ ${s.timer}</div></div>${s.lock?`<div class="buzz">🔔 ${esc(s.lock.name)} ضغط أولًا — ${esc(s.teams.find(t=>t.id===s.lock.team)?.name||'')}</div>`:''}<div class="answers" style="margin-top:16px">${(s.answers||[]).map((a,i)=>`<button class="answer ${a.revealed?'revealed':'hiddenAns'}" onclick="reveal(${i})">${a.revealed?`<div>${esc(a.text)}<span class="pts">${a.points} نقطة</span></div>`:'؟'}</button>`).join('')}</div><div class="toolbar" style="margin-top:18px">${s.phase==='question'?(s.answers||[]).filter(a=>a.revealed).map(a=>`<button class="btn gold" onclick="awardPrompt(${a.points})">+${a.points} نقطة</button>`).join(''):''}${s.phase==='lobby'&&s.currentRound<s.rounds?`<button class="btn primary" onclick="pickQuestion()">▶️ اختيار وبدء السؤال</button>`:''}${s.phase==='question'?`<button class="btn dark" onclick="nextRound()">⏭️ نهاية الجولة</button>`:''}<button class="btn danger" onclick="resetScores()">تصفير النقاط</button>${s.phase!=='finished'?`<button class="btn danger" onclick="endGame()">إنهاء اللعبة</button>`:''}</div></section><section class="card"><div class="row"><div><h2>🧠 بنك الأسئلة</h2><p class="muted">الإجابات الصحيحة تظهر هنا للمقدم فقط.</p></div><button class="btn primary" onclick="addQuestion()">＋ سؤال</button></div>${bank.map((q,i)=>`<div class="bankRow"><div class="row"><div><b>${esc(q.q)}</b><div class="muted small">${q.a.length} إجابات</div></div><div class="toolbar"><button class="btn primary" onclick="startRound(${i})">استخدم</button><button class="btn danger" onclick="deleteQuestion(${i})">حذف</button></div></div><div style="margin-top:9px">${q.a.map(a=>`<span class="pill" style="margin:3px">${esc(a[0])} • ${a[1]}</span>`).join('')}</div></div>`).join('')}</section></div>`}
function teamCard(t){return `<div class="team ${t.id==='A'?'a':'b'}"><div class="teamName">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</div><div class="score">${t.score}</div><div class="strikes">${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div><div class="players">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد متسابقون'}</div><div class="toolbar"><button class="btn danger" onclick="strike('${t.id}')">Strike</button><button class="btn dark" onclick="resetStrike('${t.id}')">تصفير</button></div></div>`}
function pickQuestion(){const bank=lastState.questionBank||[];const options=bank.map((q,i)=>`${i+1}. ${q.q}`).join('\n');const n=Number(prompt('اختر رقم السؤال:\n\n'+options));if(Number.isInteger(n)&&n>=1&&n<=bank.length)startRound(n-1)}
function startRound(i){socket.emit('host:startRound',{code,questionIndex:i})}function addQuestion(){const q=prompt('السؤال');if(!q)return;const a=[];for(let i=0;i<8;i++){const t=prompt('الإجابة '+(i+1)+' — اتركها فارغة للإنهاء');if(!t)break;const p=Number(prompt('النقاط',String(Math.max(1,35-i*5))));a.push([t,p||0])}if(a.length)socket.emit('host:addQuestion',{code,question:{q,a}})}function deleteQuestion(i){if(confirm('حذف السؤال؟'))socket.emit('host:deleteQuestion',{code,index:i})}function reveal(i){clickSound();socket.emit('host:reveal',{code,index:i})}function strike(t){tone(120,.35,'sawtooth',.18);socket.emit('host:strike',{code,team:t})}function resetStrike(t){socket.emit('host:resetStrikes',{code,team:t})}function resetScores(){if(confirm('تصفير النقاط؟'))socket.emit('host:resetScores',{code})}function nextRound(){socket.emit('host:next',{code})}function endGame(){if(confirm('إنهاء اللعبة؟'))socket.emit('host:end',{code})}function awardPrompt(p){const t=prompt('اكتب A للفريق الأحمر أو B للفريق الأزرق');if(t)socket.emit('host:award',{code,team:t.trim().toUpperCase(),points:p})}
function openShare(){modal(`<h2>📤 مشاركة الغرفة</h2><div class="row"><div><div style="font-size:42px;font-weight:1000;letter-spacing:7px">${esc(code)}</div><p class="muted">أرسل رمز الغرفة فقط للمتسابقين. لا تشارك PIN المقدم.</p></div><img class="qr" src="/qr/${encodeURIComponent(code)}"></div><button class="btn primary" onclick="closeModal()">إغلاق</button>`)}
function display(){role='display';app.innerHTML=`<div class="shell"><section class="card hero"><div class="mark" style="margin:auto">📺</div><h1>شاشة العرض</h1><p class="sub">أدخل رمز الغرفة لعرض اللعبة على التلفزيون.</p><input class="input" id="dc" placeholder="مثال: A7K9B" autocomplete="off"><button class="btn gold" onclick="joinDisplay()">تشغيل الشاشة</button><button class="btn dark" onclick="home()">رجوع</button></section></div>`}function joinDisplay(){code=$('dc').value.trim().toUpperCase();if(code)socket.emit('display:join',{code})}
function renderDisplay(s){const winner=s.phase==='finished'?(s.teams[0].score===s.teams[1].score?'تعادل!':s.teams[0].score>s.teams[1].score?s.teams[0].name:s.teams[1].name):'';app.innerHTML=`<div class="stage"><div class="tv"><section class="card"><div class="topbar">${logo()}<div class="pill">الجولة ${s.currentRound} / ${s.rounds}</div></div><div class="teams">${s.teams.map(t=>`<div class="team ${t.id==='A'?'a':'b'}"><div class="teamName">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</div><div class="score">${t.score}</div><div class="strikes">${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div></div>`).join('')}</div>${winner?`<div class="winner">🎉 ${esc(winner)} 🎉</div><div class="confetti">✨ 🎊 ⭐ 🎊 ✨</div>`:`<div class="question">${esc(s.question||'استعدوا...')}</div>${s.lock?`<div class="buzz">🔔 ${esc(s.lock.name)} ضغط أولًا!</div>`:''}<div class="answers">${(s.answers||[]).map(a=>`<div class="answer ${a.revealed?'revealed':'hiddenAns'}">${a.revealed?`<div>${esc(a.text)}<span class="pts">${a.points} نقطة</span></div>`:'؟'}</div>`).join('')}</div><div class="timer ${s.timer<=5?'hot':''}">⏱️ ${s.timer}</div>`}</section></div><button class="btn dark sound" onclick="toggleSound()">🔊</button></div>`}
function player(){role='player';app.innerHTML=`<div class="shell"><section class="card hero"><div class="mark" style="margin:auto">📱</div><h1>دخول المتسابق</h1><p class="sub">أدخل رمز الغرفة واختر فريقك.</p><input class="input" id="pc" placeholder="رمز الغرفة"><input class="input" id="pn" placeholder="اسمك"><select id="pt"><option value="A">🔴 الفريق الأحمر</option><option value="B">🔵 الفريق الأزرق</option></select><button class="btn red" onclick="joinPlayer()">دخول اللعبة</button><button class="btn dark" onclick="home()">رجوع</button></section></div>`}function joinPlayer(){code=$('pc').value.trim().toUpperCase();const name=$('pn').value.trim();playerTeam=$('pt').value;if(code&&name)socket.emit('player:join',{code,name,team:playerTeam})}
function renderPlayer(s){const t=s?.teams?.find(x=>x.id===playerTeam);const disabled=!s||s.phase!=='question'||!!s.lock||!t||t.strikes>=3||s.timer<=0;app.innerHTML=`<div class="shell"><section class="card hero"><div class="pill">🏠 ${esc(code)}</div><h1 style="font-size:clamp(32px,8vw,60px)">${esc(t?.name||'المتسابق')}</h1><p class="sub">${s?.lock?`🔒 ${esc(s.lock.name)} ضغط أولًا`:s?.phase==='question'?'⚡ استعد!':'انتظر بدء الجولة'}</p><button class="buzzer" onclick="buzz()" ${disabled?'disabled':''}>${s?.lock?'🔒 مغلق':s?.timer===0?'انتهى الوقت':'اضغط! 🔔'}</button><div class="timer ${s?.timer<=5?'hot':''}">${s?.timer??'—'}</div><p class="muted">أول ضغطة تُحتسب. 3 Strikes تعطل الفريق. 🔒 الإجابات مخفية عن المتسابقين.</p></section></div>`}function buzz(){socket.emit('buzzer:press',{code})}
socket.on('buzzer:locked',x=>{tone(880,.35,'square',.18);if(role==='display')fanfare();});socket.on('timer',n=>{if(role==='display'&&n<=5)tone(n===0?160:540,.1,'triangle',.1)});socket.on('state',s=>{if(lastState&&s.answers?.some((a,i)=>a.revealed&&!lastState.answers?.[i]?.revealed)){tone(740,.22,'triangle');if(role==='display')setTimeout(fanfare,120)}if(lastState?.phase!=='finished'&&s.phase==='finished')fanfare();lastState=s;if(role==='host')renderHost(s);else if(role==='display')renderDisplay(s);else if(role==='player')renderPlayer(s)});socket.on('player:joined',x=>{playerTeam=x.team;toast('مرحبًا '+x.name)});socket.on('error:msg',m=>toast('⚠️ '+m));
const join=new URLSearchParams(location.search).get('join');if(join){role='player';setTimeout(()=>{player();$('pc').value=join.toUpperCase()},0)}else home();
</script></body></html>
