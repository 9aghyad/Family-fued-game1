<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a12"><title>لعبة العائلة — 1000 سؤال</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#05070d;--panel:#0d1423;--panel2:#131d31;--line:#2d3b58;--text:#f8fafc;--muted:#9eabc1;--gold:#ffd166;--red:#ef4052;--red2:#8e1d2d;--blue:#3287ff;--blue2:#124d9c;--violet:#765cff;--green:#35d399}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}body{overflow-x:hidden}.app{min-height:100vh}.shell{width:min(1500px,96vw);margin:auto;padding:22px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:1000}.mark{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),var(--violet),var(--blue));box-shadow:0 12px 38px #0008;font-size:25px}.card{background:linear-gradient(180deg,#111a2ddd,#0b1120f8);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 22px 70px #0008;backdrop-filter:blur(14px)}.hero{padding:58px 30px;text-align:center}.hero h1{font-size:clamp(40px,7vw,82px);line-height:1;margin:14px 0}.sub{color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.btn{border:0;border-radius:15px;padding:13px 17px;font-weight:900;cursor:pointer;background:#e8edf7;color:#10131b;transition:.18s transform,.18s filter}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}.primary{background:linear-gradient(135deg,#765cff,#5745e9);color:#fff}.red{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}.blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}.dark{background:#1a2337;color:#fff}.gold{background:linear-gradient(135deg,#ffe38a,#dcae38);color:#241b06}.danger{background:#7e2330;color:#fff}.input,select{width:100%;background:#080e1a;color:#fff;border:1px solid #34415f;border-radius:14px;padding:13px;margin:6px 0 12px;font:inherit}.label{font-size:13px;color:#b7c2d6}.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #33405d;background:#19233a;border-radius:999px;color:#dce5f4}.teams{display:grid;grid-template-columns:1fr 1fr;gap:16px}.team{border-radius:23px;padding:20px;border:1px solid #33415f;background:#111a2c;position:relative;overflow:hidden}.team.a{border-color:#7f2d3b}.team.b{border-color:#285c9f}.teamName{font-size:21px;font-weight:1000}.score{font-size:66px;font-weight:1000;line-height:1;margin:10px 0}.strikes{font-size:25px;letter-spacing:4px}.players{color:#b9c5d9;min-height:26px;margin:7px 0}.question{font-size:clamp(28px,4vw,52px);font-weight:1000;text-align:center;line-height:1.15;margin:24px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{min-height:92px;border-radius:18px;border:1px solid #36445f;background:linear-gradient(180deg,#202c45,#151e31);display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900;padding:15px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}.answer:hover{transform:translateY(-2px)}.answer .pts{display:block;color:var(--gold);font-size:18px;margin-top:4px}.answer.revealed{animation:reveal .55s cubic-bezier(.2,.9,.2,1);border-color:#b8c8ef;box-shadow:0 0 35px #6d5dfc35;color:#fff!important;background:linear-gradient(180deg,#2b3b5d,#1a2740)}.answer.hiddenAns{color:#fff;background:radial-gradient(circle,#263756,#141d2f)}.answer.hostAnswer{color:#fff;background:linear-gradient(180deg,#263957,#17243a);border-color:#526789}.answer.hostAnswer:hover{border-color:#7f95bd}.buzz{padding:18px;text-align:center;border:1px solid #556582;background:#19233a;border-radius:18px;font-size:25px;font-weight:1000;animation:buzz .4s 2}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.bankRow{padding:17px;border:1px solid #2d3a56;border-radius:18px;background:#121b2d;margin:10px 0}.bankAnswer{display:inline-flex;align-items:center;gap:6px;margin:3px;padding:7px 10px;border-radius:10px;background:#1a263d;border:1px solid #33415e}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.qr{width:190px;height:190px;background:#fff;padding:10px;border-radius:18px}.muted{color:var(--muted)}.sound{position:fixed;left:18px;bottom:18px;z-index:50;border-radius:999px}.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-130%);background:#111b2e;border:1px solid #3a4967;border-radius:999px;padding:12px 18px;z-index:100;font-weight:800;transition:.3s}.toast.show{transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:80;padding:20px}.modalBox{max-width:700px;width:100%;max-height:90vh;overflow:auto;background:#10182a;border:1px solid #394865;border-radius:25px;padding:25px;box-shadow:0 30px 90px #000}.hidden{display:none!important}.creator-credit{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:45;color:#9eabc2;font-size:12px;font-weight:800;letter-spacing:.2px;text-align:center;white-space:nowrap;text-shadow:0 2px 10px #000}.tv .creator-credit{font-size:clamp(12px,1vw,18px);bottom:14px}
/* TV / broadcast layout: landscape first, minimal chrome, large readable elements */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#202b4a 0,#090d18 48%,#05070d 100%);padding:1.5vw}.tv{width:min(1840px,98vw);height:min(100vh,1040px);display:flex;align-items:center}.tv .card{width:100%;padding:2.2vw;border-radius:32px;background:linear-gradient(180deg,#0d1629f5,#070c17fa);border-color:#3b4865;box-shadow:0 0 90px #000c}.tv .broadcastHeader{display:flex;align-items:center;justify-content:space-between;gap:20px}.tv .broadcastTitle{font-size:clamp(24px,2.4vw,46px);font-weight:1000}.tv .roundBadge{font-size:clamp(18px,1.5vw,28px);padding:10px 18px}.tv .tvTeams{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;margin:1.2vw 0}.tv .tvTeam{padding:1vw 1.4vw;border-radius:22px;border:2px solid #35415b;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:18px;min-height:105px}.tv .tvTeam.a{border-color:#8b3040;background:linear-gradient(90deg,#24131a,#111a2b)}.tv .tvTeam.b{border-color:#2e65aa;background:linear-gradient(90deg,#111a2b,#10182a)}.tv .tvTeamName{font-size:clamp(22px,2vw,38px);font-weight:1000}.tv .tvScore{font-size:clamp(48px,5vw,90px);font-weight:1000;line-height:1}.tv .tvStrikes{font-size:clamp(22px,2vw,34px);letter-spacing:5px}.tv .question{font-size:clamp(32px,4.1vw,76px);margin:1.2vw 0;text-shadow:0 5px 30px #000}.tv .answers{grid-template-columns:repeat(3,1fr);gap:1vw}.tv .answer{min-height:clamp(90px,11vh,150px);font-size:clamp(22px,2.1vw,40px);border-width:2px;border-radius:22px}.tv .answer .pts{font-size:clamp(17px,1.4vw,28px);margin-top:6px}.tv .buzz{font-size:clamp(22px,2vw,38px);margin:1vw 0}.doubleBadge{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:linear-gradient(135deg,#ffe066,#ff9f1c);color:#201300;font-weight:1000;box-shadow:0 0 35px #ffcf4a88;animation:doublePulse .8s infinite alternate}.doubleFlash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:70;font-size:clamp(70px,15vw,240px);font-weight:1000;color:#ffd84d;text-shadow:0 0 30px #ff7b00,0 0 80px #fff;animation:doubleFlash 1.1s ease-out forwards}.tv .broadcastHint{text-align:center;color:#8997b0;font-size:clamp(13px,1.1vw,20px);margin-top:1vw}.tv .winner{font-size:clamp(52px,7vw,120px);font-weight:1000;text-align:center;margin:3vw 0 1vw}.tv .confetti{text-align:center;font-size:clamp(30px,4vw,70px);letter-spacing:18px}
.buzzer{width:100%;height:240px;border:0;border-radius:38px;background:radial-gradient(circle at 50% 35%,#ff6b79,var(--red) 45%,#a71f31);color:#fff;font-size:52px;font-weight:1000;box-shadow:0 15px 0 #791827,0 30px 60px #0009;cursor:pointer;transition:.15s}.buzzer:active{transform:translateY(10px);box-shadow:0 5px 0 #791827}.buzzer:disabled{background:#3a4251;box-shadow:none;cursor:not-allowed}
@keyframes reveal{0%{transform:rotateX(90deg) scale(.8);opacity:0}100%{transform:rotateX(0) scale(1);opacity:1}}@keyframes buzz{50%{transform:scale(1.02);filter:brightness(1.5)}}@keyframes doublePulse{to{transform:scale(1.06);filter:brightness(1.25)}}@keyframes doubleFlash{0%{opacity:0;transform:scale(.3) rotate(-8deg)}20%{opacity:1;transform:scale(1.15) rotate(3deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
@media(max-width:900px){.grid,.grid3,.teams,.answers{grid-template-columns:1fr}.shell{padding:12px}.hero{padding:36px 18px}.buzzer{height:200px;font-size:42px}.tv{padding:0;height:auto}.tv .tvTeams{gap:8px}.tv .tvTeam{grid-template-columns:1fr auto;min-height:78px}.tv .tvStrikes{grid-column:1/-1}.tv .answers{grid-template-columns:1fr 1fr}.tv .answer{min-height:86px}.qr{width:145px;height:145px}}
</style>
</head>
<body><div id="toast" class="toast"></div><main id="app" class="app"></main><div class="creator-credit">تم إنشاء اللعبة من قبل أغيد</div>
<script>
const socket=io();let role='',code='',playerTeam='',lastState=null,soundOn=true,audioCtx=null,bankSearch='';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tone(freq=440,d=.16,type='sine',gain=.14){if(!soundOn)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.02)}
function fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.24,'triangle',.12),i*110))}function clickSound(){tone(330,.07,'square',.06)}function toggleSound(){soundOn=!soundOn;toast(soundOn?'🔊 المؤثرات مفعلة':'🔇 المؤثرات مكتومة');if(soundOn)tone(660,.12,'triangle')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2400)}
function logo(){return `<div class="brand"><div class="mark">🏆</div><div><div>لعبة العائلة</div><div class="muted" style="font-size:11px">FAMILY FEUD • V7</div></div></div>`}
function go(path){location.href=path}
function home(){role='';history.replaceState({},'', '/');app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="toggleSound()">🔊 الصوت</button></div><section class="card hero"><div class="pill">📺 نسخة تلفزيونية عريضة</div><h1>لعبة العائلة</h1><p class="sub">مقدم مستقل • شاشة عرض مستقلة • صفحة متسابقين مستقلة</p><div class="grid" style="margin-top:28px"><button class="btn primary" onclick="go('/host')">🎤 صفحة المقدم</button><button class="btn gold" onclick="go('/display')">📺 صفحة العرض</button><button class="btn red" onclick="go('/player')">📱 صفحة المتسابقين</button><button class="btn dark" onclick="showHow()">❓ طريقة اللعب</button></div></section></div>`}
function showHow(){modal(`<h2>🎬 طريقة اللعب</h2><p class="muted">المقدم ينشئ الغرفة ويحتفظ بـ PIN المقدم. المتسابقون يدخلون من رابط المتسابقين برمز الغرفة، بينما التلفزيون يستخدم رابط شاشة العرض. لا يوجد مؤقت للجولة في هذه النسخة. المقدم يكشف الإجابات ويضيف النقاط وينتقل للسؤال التالي بنفسه.</p><button class="btn primary" onclick="closeModal()">فهمت</button>`)}
function modal(html){let m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML=`<div class="modalBox">${html}</div>`;document.body.appendChild(m)}function closeModal(){$('modal')?.remove()}
function host(){role='host';const savedCode=localStorage.getItem('ff_host_code'),savedPin=localStorage.getItem('ff_host_pin');app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="home()">الرئيسية</button></div><section class="card" style="margin-top:16px"><h1>🎤 صفحة المقدم</h1><p class="muted">هذه الصفحة منفصلة عن صفحة المتسابقين. الدخول إلى غرفة موجودة يحتاج PIN المقدم، وليس رمز الغرفة وحده.</p><div class="grid"><div><label class="label">عدد الجولات</label><input class="input" id="rounds" type="number" min="1" max="50" value="5"></div><div><label class="label">اسم الفريق الأحمر</label><input class="input" id="ta" value="الفريق الأحمر"></div><div><label class="label">اسم الفريق الأزرق</label><input class="input" id="tb" value="الفريق الأزرق"></div></div><div class="toolbar"><button class="btn primary" onclick="createGame()">✨ إنشاء غرفة جديدة</button><button class="btn dark" onclick="rejoinHost()">🔐 دخول غرفة موجودة</button></div>${savedCode?`<div class="bankRow" style="margin-top:18px"><b>غرفة محفوظة على هذا الجهاز</b><div class="muted">${esc(savedCode)}</div><button class="btn gold" style="margin-top:10px" onclick="autoRejoin()">متابعة كـمقدم</button></div>`:''}</section></div>`}
function createGame(){clickSound();socket.emit('host:create',{rounds:+$('rounds').value,teamA:$('ta').value,teamB:$('tb').value})}
function rejoinHost(){const c=prompt('رمز الغرفة');const p=prompt('PIN المقدم (6 أرقام)');if(c&&p){code=c.toUpperCase();localStorage.setItem('ff_host_code',code);localStorage.setItem('ff_host_pin',p);socket.emit('host:rejoin',{code,pin:p})}}
function autoRejoin(){const c=localStorage.getItem('ff_host_code'),p=localStorage.getItem('ff_host_pin');if(c&&p){code=c;socket.emit('host:rejoin',{code,pin:p})}}
socket.on('game:created',x=>{code=x.code;localStorage.setItem('ff_host_code',x.code);localStorage.setItem('ff_host_pin',x.pin);history.replaceState({},'',`/host?code=${encodeURIComponent(x.code)}`);toast('تم إنشاء الغرفة '+x.code);renderHost(lastState||{});modal(`<h2>🎉 الغرفة جاهزة</h2><div class="row"><div><div style="font-size:44px;font-weight:1000;letter-spacing:7px">${esc(x.code)}</div><p>PIN المقدم: <b>${esc(x.pin)}</b></p><p class="muted">شارك رابط المتسابقين ورمز الغرفة. لا تشارك PIN.</p></div><img class="qr" src="/qr/${encodeURIComponent(x.code)}" alt="QR"></div><button class="btn primary" onclick="closeModal()">ابدأ</button>`)})
socket.on('host:rejoined',()=>{toast('تم الدخول كـمقدم');renderHost(lastState||{})})
function renderHost(s){
  lastState=s;
  if(!s?.code){
    app.innerHTML=`<div class="shell"><div class="topbar">${logo()}<button class="btn dark" onclick="home()">الرئيسية</button></div><section class="card hero"><h1>لوحة المقدم</h1><p class="muted">أنشئ غرفة أو ادخل غرفة موجودة باستخدام PIN.</p></section></div>`;
    return;
  }
  const bank=s.questionBank||[];
  const canStart=s.currentRound<s.rounds&&bank.length&&!['finished'].includes(s.phase);
  app.innerHTML=`<div class="shell">
    <div class="topbar">${logo()}<div class="toolbar"><span class="pill">🎤 مقدم • ${esc(s.code)}</span><button class="btn dark" onclick="openShare()">📤 مشاركة</button><button class="btn dark" onclick="toggleSound()">🔊</button></div></div>
    <section class="card"><div class="teams">${s.teams.map(t=>teamCard(t)).join('')}</div></section>
    <section class="card">
      <div class="row"><div><span class="pill">السؤال ${s.currentRound} / ${s.rounds}</span><h2>${esc(s.question||'اختر سؤالًا عشوائيًا أو اختر سؤالًا من بنك الأسئلة')}</h2></div>
      <div class="toolbar"><button class="btn gold" onclick="randomQuestion()" ${canStart?'':'disabled'}>🎲 سؤال عشوائي</button>${s.phase==='question'?`<button class="btn primary" onclick="nextQuestion()" ${s.currentRound>=s.rounds?'disabled':''}>⏭️ السؤال التالي</button>`:''}</div></div>
      ${s.lock?`<div class="buzz">🔔 ${esc(s.lock.name)} ضغط أولًا — ${esc(s.teams.find(t=>t.id===s.lock.team)?.name||'')}</div>`:''}
      ${s.teams.some(t=>t.doubleActive)?`<div class="doubleBadge" style="margin-top:12px">⚡ الدبل مفعل لـ ${esc(s.teams.find(t=>t.doubleActive)?.name||'')} — ${esc(s.teams.find(t=>t.doubleActive)?.doublePlayer||'')}</div>`:''}
      <div class="answers" style="margin-top:16px">${(s.answers||[]).map((a,i)=>`
        <div class="answer ${a.revealed?'revealed':'hostAnswer'}" style="cursor:default">
          <div style="width:100%">
            <div class="row" style="align-items:center;gap:10px">
              <span style="font-weight:1000">${esc(a.text)}</span><span class="pts">${a.points} نقطة</span>
            </div>
            <small style="display:block;margin-top:6px;color:var(--muted)">${a.revealed?'✓ مكشوفة للعرض':'👁️ الإجابة ظاهرة للمقدم فقط'}</small>
            <div class="toolbar" style="margin-top:10px">
              <button class="btn red" onclick="reveal(${i})" ${a.revealed?'disabled':''}>${a.revealed?'✓ مكشوفة':'👁️ كشف الإجابة'}</button>
              <button class="btn red" onclick="awardAnswer(${i},'A')" ${!a.revealed||a.awarded?'disabled':''}>🔴 +${a.points} لـ ${esc(s.teams[0].name)}</button>
              <button class="btn blue" onclick="awardAnswer(${i},'B')" ${!a.revealed||a.awarded?'disabled':''}>🔵 +${a.points} لـ ${esc(s.teams[1].name)}</button>
              ${a.awarded?`<span class="pill">✓ تم احتسابها</span>`:''}
            </div>
          </div>
        </div>`).join('')}</div>
      <div class="toolbar" style="margin-top:18px">${s.phase==='lobby'&&canStart?`<button class="btn primary" onclick="randomQuestion()">🎲 ابدأ بسؤال عشوائي</button>`:''}<button class="btn dark" onclick="resetScores()">تصفير النقاط</button></div>
    </section>
    <section class="card">
      <div class="row"><div><h2>🧠 بنك الأسئلة — ${bank.length} / 1000</h2><p class="muted">اختر أي سؤال مباشرة من هنا، أو استخدم البحث، أو اترك الاختيار عشوائيًا.</p></div><button class="btn primary" onclick="addQuestion()">＋ سؤال جديد</button></div>
      <input class="input" id="bankSearch" placeholder="🔎 ابحث في الأسئلة..." value="${esc(bankSearch)}" oninput="bankSearch=this.value;document.getElementById('bankList').innerHTML=renderBankRows(lastState.questionBank||[])">
      <div id="bankList">${renderBankRows(bank)}</div>
    </section>
  </div>`;
}
function renderBankRows(bank){
  const term=(bankSearch||'').trim().toLowerCase();
  const rows=bank.map((q,i)=>({q,i})).filter(x=>!term||x.q.q.toLowerCase().includes(term)||x.q.a.some(a=>String(a[0]).toLowerCase().includes(term)));
  if(!rows.length)return `<div class="bankRow"><div class="muted">لا توجد نتائج مطابقة للبحث.</div></div>`;
  return rows.map(({q,i})=>`<div class="bankRow"><div class="row"><div style="flex:1;min-width:220px"><b>${i+1}. ${esc(q.q)}</b><div class="muted" style="margin-top:5px">${q.a.length} إجابات</div></div><div class="toolbar"><button class="btn primary" onclick="selectBankQuestion(${i})">▶️ اختيار السؤال</button><button class="btn danger" onclick="deleteQuestion(${i})">حذف</button></div></div><div style="margin-top:9px">${q.a.map(a=>`<span class="bankAnswer">${esc(a[0])} <b>${a[1]}</b></span>`).join('')}</div></div>`).join('');
}
function teamCard(t){return `<div class="team ${t.id==='A'?'a':'b'}"><button class="teamName btn ${t.id==='A'?'red':'blue'}" style="width:100%;font-size:21px" onclick="awardTeam('${t.id}')">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)} — اضغط لإضافة النقاط</button><div class="score">${t.score}</div><div class="strikes">${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div><div class="players">${t.players.map(p=>esc(p.name)).join(' • ')||'لا يوجد متسابقون'}</div><div class="toolbar"><span class="pill">${t.doubleUsed?'⚡ الدبل مستخدم':'⚡ الدبل متاح'}</span><button class="btn danger" onclick="strike('${t.id}')">Strike</button><button class="btn dark" onclick="resetStrike('${t.id}')">تصفير</button></div></div>`}
function startRound(i){socket.emit('host:startRound',{code,questionIndex:i})}
function selectBankQuestion(i){const bank=lastState.questionBank||[];if(!bank[i])return;if(lastState.currentRound>=lastState.rounds||lastState.phase==='finished')return toast('انتهت الجولات');startRound(i)}
function randomQuestion(){const bank=lastState.questionBank||[];if(!bank.length||lastState.currentRound>=lastState.rounds||lastState.phase==='finished')return;let choices=bank.map((_,i)=>i).filter(i=>i!==lastState.questionIndex);if(!choices.length)choices=[0];startRound(choices[Math.floor(Math.random()*choices.length)])}
function nextQuestion(){socket.emit('host:nextQuestion',{code})}
function addQuestion(){const q=prompt('السؤال');if(!q)return;const a=[];for(let i=0;i<8;i++){const t=prompt('الإجابة '+(i+1)+' — اتركها فارغة للإنهاء');if(!t)break;const p=Number(prompt('النقاط',String(Math.max(1,35-i*5))));a.push([t,p||0])}if(a.length)socket.emit('host:addQuestion',{code,question:{q,a}})}
function deleteQuestion(i){if(confirm('حذف السؤال؟'))socket.emit('host:deleteQuestion',{code,index:i})}
function reveal(i){clickSound();socket.emit('host:reveal',{code,index:i})}
function awardAnswer(index,team){const a=(lastState.answers||[])[index];if(!a||!a.revealed||a.awarded)return;socket.emit('host:award',{code,team,points:a.points,answerIndex:index})}
function strike(t){tone(120,.35,'sawtooth',.18);socket.emit('host:strike',{code,team:t})}
function resetStrike(t){socket.emit('host:resetStrikes',{code,team:t})}
function resetScores(){if(confirm('تصفير النقاط؟'))socket.emit('host:resetScores',{code})}
function openShare(){const playerUrl=location.origin+'/player?join='+encodeURIComponent(code);modal(`<h2>📤 روابط اللعبة</h2><p><b>رمز الغرفة:</b> ${esc(code)}</p><p class="muted">المتسابقون يستخدمون صفحة المتسابقين فقط، والمقدم له PIN مستقل، وشاشة التلفزيون لها رابط منفصل.</p><div class="bankRow"><b>رابط المتسابقين</b><div style="word-break:break-all">${esc(playerUrl)}</div></div><div class="row"><div><b>QR للمتسابقين</b><p class="muted">امسحه من جوالات اللاعبين.</p></div><img class="qr" src="/qr/${encodeURIComponent(code)}"></div><button class="btn primary" onclick="closeModal()">إغلاق</button>`) }
function openShare(){const playerUrl=location.origin+'/player?join='+encodeURIComponent(code);modal(`<h2>📤 روابط اللعبة</h2><p><b>رمز الغرفة:</b> ${esc(code)}</p><p class="muted">المتسابقون يستخدمون صفحة المتسابقين فقط. شاشة التلفزيون تستخدم صفحة العرض. صفحة المقدم لا تعتمد على رمز الغرفة وحده؛ تحتاج PIN.</p><div class="bankRow"><b>رابط المتسابقين</b><div style="word-break:break-all">${esc(playerUrl)}</div></div><div class="row"><div><b>QR للمتسابقين</b><p class="muted">امسحه من جوالات اللاعبين.</p></div><img class="qr" src="/qr/${encodeURIComponent(code)}"></div><button class="btn primary" onclick="closeModal()">إغلاق</button>`) }
function display(){role='display';const q=new URLSearchParams(location.search).get('code')||new URLSearchParams(location.search).get('join')||'';app.innerHTML=`<div class="shell"><section class="card hero"><div class="mark" style="margin:auto">📺</div><h1>شاشة العرض</h1><p class="sub">صفحة مستقلة للتلفزيون. أدخل رمز الغرفة أو افتحها بالرابط.</p><input class="input" id="dc" placeholder="رمز الغرفة" value="${esc(q.toUpperCase())}"><button class="btn gold" onclick="joinDisplay()">تشغيل الشاشة</button><button class="btn dark" onclick="home()">رجوع</button></section></div>`}
function joinDisplay(){code=$('dc').value.trim().toUpperCase();if(code){history.replaceState({},'',`/display?code=${encodeURIComponent(code)}`);socket.emit('display:join',{code})}}
function renderDisplay(s){const winner=s.phase==='finished'?(s.teams[0].score===s.teams[1].score?'تعادل!':s.teams[0].score>s.teams[1].score?s.teams[0].name:s.teams[1].name):'';app.innerHTML=`<div class="stage"><div class="tv"><section class="card"><div class="broadcastHeader"><div class="broadcastTitle">🏆 لعبة العائلة</div><div class="pill roundBadge">السؤال ${s.currentRound} / ${s.rounds}</div></div><div class="tvTeams">${s.teams.map(t=>`<div class="tvTeam ${t.id==='A'?'a':'b'}"><div class="tvTeamName">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)} ${t.doubleActive?`<span class="doubleBadge">⚡ ×2 ${esc(t.doublePlayer)}</span>`:''}</div><div class="tvScore">${t.score}</div><div class="tvStrikes">${'✕'.repeat(t.strikes)}${'○'.repeat(3-t.strikes)}</div></div>`).join('')}</div>${winner?`<div class="winner">🎉 ${esc(winner)} 🎉</div><div class="confetti">✨ 🎊 ⭐ 🎊 ✨</div>`:`<div class="question">${esc(s.question||'استعدوا...')}</div>${s.lock?`<div class="buzz">🔔 ${esc(s.lock.name)} ضغط أولًا!</div>`:''}<div class="answers">${(s.answers||[]).map(a=>`<div class="answer ${a.revealed?'revealed':'hiddenAns'}">${a.revealed?`<div>${esc(a.text)}<span class="pts">${a.points} نقطة</span></div>`:'؟'}</div>`).join('')}</div><div class="broadcastHint">المقدم يتحكم في كشف الإجابات والانتقال بين الأسئلة</div>`}</section></div><button class="btn dark sound" onclick="toggleSound()">🔊</button></div>`}
function player(){role='player';const q=new URLSearchParams(location.search).get('join')||'';app.innerHTML=`<div class="shell"><section class="card hero"><div class="mark" style="margin:auto">📱</div><h1>دخول المتسابق</h1><p class="sub">صفحة مستقلة للمتسابقين — لا تحتوي على أدوات المقدم.</p><input class="input" id="pc" placeholder="رمز الغرفة" value="${esc(q.toUpperCase())}"><button class="btn dark" onclick="lookupTeams()">تحميل أسماء الفرق</button><input class="input" id="pn" placeholder="اسمك"><select id="pt"><option value="A">الفريق 1</option><option value="B">الفريق 2</option></select><button class="btn red" onclick="joinPlayer()">دخول اللعبة</button><button class="btn dark" onclick="home()">رجوع</button></section></div>`}
function lookupTeams(){const c=$('pc').value.trim().toUpperCase();if(c){code=c;socket.emit('player:lookup',{code:c})}}
function joinPlayer(){code=$('pc').value.trim().toUpperCase();const name=$('pn').value.trim();playerTeam=$('pt').value;if(code&&name){history.replaceState({},'',`/player?join=${encodeURIComponent(code)}`);socket.emit('player:join',{code,name,team:playerTeam})}}
function renderPlayer(s){const t=s?.teams?.find(x=>x.id===playerTeam);const disabled=!s||s.phase!=='question'||!!s.lock||!t||t.strikes>=3;const doubleDisabled=!s||s.phase!=='question'||!t||t.doubleUsed;app.innerHTML=`<div class="shell"><section class="card hero"><div class="pill">🏠 ${esc(code)}</div><h1 style="font-size:clamp(32px,8vw,60px)">${esc(t?.name||'المتسابق')}</h1><p class="sub">${s?.lock?`🔒 ${esc(s.lock.name)} ضغط أولًا`:s?.phase==='question'?'⚡ استعد!':'انتظر بدء السؤال'}</p><button class="buzzer" onclick="buzz()" ${disabled?'disabled':''}>${s?.lock?'🔒 مغلق':'اضغط! 🔔'}</button><button class="btn gold" style="margin-top:18px;width:100%;font-size:22px" onclick="useDouble()" ${doubleDisabled?'disabled':''}>⚡ مضاعفة النقاط ×2 ${t?.doubleUsed?'— مستخدمة':''}</button><p class="muted">الدبل مرة واحدة فقط لفريقك. عند تفعيله سيظهر اسمه وتأثيره على شاشة العرض.</p></section></div>`}
function buzz(){socket.emit('buzzer:press',{code})}function useDouble(){socket.emit('player:double',{code})}
socket.on('player:teams',teams=>{const sel=$('pt');if(sel){sel.innerHTML=teams.map(t=>`<option value="${t.id}">${t.id==='A'?'🔴':'🔵'} ${esc(t.name)}</option>`).join('');toast('تم تحميل أسماء الفرق')}})
socket.on('double:activated',x=>{tone(110,.55,'sawtooth',.2);if(role==='display'){const el=document.createElement('div');el.className='doubleFlash';el.textContent=`⚡ ×2 ${x.name}`;document.body.appendChild(el);setTimeout(()=>el.remove(),1200)}});
socket.on('buzzer:locked',x=>{tone(880,.35,'square',.18);if(role==='display')fanfare()});
socket.on('state',s=>{if(lastState&&s.answers?.some((a,i)=>a.revealed&&!lastState.answers?.[i]?.revealed)){tone(740,.22,'triangle');if(role==='display')setTimeout(fanfare,120)}if(lastState?.phase!=='finished'&&s.phase==='finished')fanfare();lastState=s;if(role==='host')renderHost(s);else if(role==='display')renderDisplay(s);else if(role==='player')renderPlayer(s)});
socket.on('player:joined',x=>{playerTeam=x.team;toast('مرحبًا '+x.name)});socket.on('error:msg',m=>toast('⚠️ '+m));
const path=location.pathname;const params=new URLSearchParams(location.search);
if(path==='/host')host();else if(path==='/display')display();else if(path==='/player')player();else home();
</script></body></html>
